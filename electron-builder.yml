# Packaging (DM-07: electron-builder). Unsigned until signing identities exist (S6, Q-D04/Q-D05):
# the first release (1.0.0, decision of 5 November 2026) ships unsigned, with install steps in
# docs/RELEASE.md. appId decided 5 November 2026 (Q-B07/Q-D04); it must not change after release,
# or the operating systems treat the app as a different one.
appId: in.fiducial.quotefetcher
productName: Fiducial Quote Fetcher
directories:
  output: release
  buildResources: build-resources
# Only the compiled app (main, preload, renderer) and its manifest; production node_modules are
# added by electron-builder. Nothing else under out/ is packaged, such as out/portal-demo-e2e/ (the
# temporary portal demo's test bundle, docs/ACTUAL_PRODUCT_STATUS_AUDIT.md §9).
files:
  - out/main/**
  - out/preload/**
  - out/renderer/**
  - package.json
  # The encrypted database module (DM-02) ships only what runs: its JavaScript and the prebuilt
  # macOS and Windows binaries. Its C/C++ sources, the Linux binaries and the build-time
  # node-addon-api headers are left out. (Platform-level "files" lists are not used: one holding
  # only exclusions makes electron-builder include the whole repository.)
  - '!node_modules/better-sqlite3-multiple-ciphers/{deps,src}/**'
  - '!node_modules/better-sqlite3-multiple-ciphers/prebuilds/{linux,linuxmusl}-*.node'
  - '!node_modules/node-addon-api/**'
asar: true
# DM-04 / M1 S2: the launch guard alone cannot stop Node's inspector; these fuses are mandatory.
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  resetAdHocDarwinSignature: true
mac:
  category: public.app-category.business
  identity: null
  target:
    - target: dmg
      arch: [arm64, x64]
dmg:
  sign: false
win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
# No auto-update in R1 unless hosting and signing are ready (P1-04).
publish: null
