# Packaging (DM-07: electron-builder). Unsigned until signing identities exist (S6, Q-D04/Q-D05).
# appId is a placeholder until the client's identifier is confirmed (Q-B07/Q-D04).
appId: local.fiducial.quotefetcher
productName: Fiducial Quote Fetcher
directories:
  output: release
  buildResources: build-resources
# Only the compiled app (main, preload, renderer) and its manifest; production node_modules are
# added by electron-builder. Nothing else under out/ is packaged, such as out/portal-demo-e2e/ (the
# temporary portal demo's test bundle, docs/ACTUAL_PRODUCT_STATUS_AUDIT.md §9).
files:
  - out/main/**
  - out/preload/**
  - out/renderer/**
  - package.json
asar: true
# DM-04 / M1 S2: the launch guard alone cannot stop Node's inspector; these fuses are mandatory.
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  resetAdHocDarwinSignature: true
mac:
  category: public.app-category.business
  identity: null
  target:
    - target: dmg
      arch: [arm64, x64]
dmg:
  sign: false
win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
# No auto-update in R1 unless hosting and signing are ready (P1-04).
publish: null
