# CI for the product app (M2; M3 adds the coverage gate). Actions are pinned to commit SHAs.
# First run (40454782355, commit 37879c5): macOS passed; Windows failed at `npm run lint`
# (Prettier flagged all 50 files: CRLF checkout, reproduced; ARCHITECTURE_REVIEW AR-25) and
# skipped the later steps.
# "CI green" remains open; see IMPLEMENTATION_STATUS §1d.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # AR-19: every Electron launch goes through scripts/run-clean-env.mjs or scripts/smoke.mjs,
    # which remove ELECTRON_RUN_AS_NODE and NODE_OPTIONS from the child environment.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx install-electron
      - run: npm run secrets:scan
      - run: npm run lint
      - run: npm run typecheck
      # Runs every test and enforces 100% coverage of money, comparison and validation (M3).
      - run: npm run test:coverage
      - run: npm run test:smoke
